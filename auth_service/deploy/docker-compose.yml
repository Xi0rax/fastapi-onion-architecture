version: "3.8"

services:
  auth_postgres:
    image: postgres:15.1-alpine
    container_name: auth_postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: auth_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
