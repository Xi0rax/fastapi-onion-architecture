[tool.poetry]
name = "email-service"
version = "0.1.0"
description = "Email notification consumer service for the FastAPI onion architecture example"
authors = ["Uoiferise <uoiferise@mail.ru>", "Xi0rax <phaule@yandex.ru>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = { extras = ["all"], version = "^0.108.0" }
python-dotenv = "^1.0.1"
aio-pika = "^9.4.0"
loguru = "^0.7.2"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "0.21.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"
